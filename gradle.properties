# Gradle itself has to start before it can apply the Java 17 toolchain from build.gradle.kts.
# A newer JDK sitting first on PATH breaks that: Gradle 8.14 cannot parse a version string like
# "26.0.2.1" and fails before running a single task. Pinning the daemon JVM keeps the build
# working no matter which java is on PATH.
#
# This path is machine specific. If you move the project to another PC, either update it here or
# move the line to %USERPROFILE%\.gradle\gradle.properties and delete it from this file.
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17

# The launcher is a desktop app: a few forked JVMs is plenty, and a watching file tree is not
# wanted while the game is downloading.
org.gradle.daemon=true
org.gradle.parallel=false
